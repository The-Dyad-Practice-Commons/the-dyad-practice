summits:
  - "Scaling one operator's reach across a team of independent AI dyads without becoming their bottleneck or overriding their judgment. Realized: the coordination scheme survived independent review by the very dyads it coordinates."
  - "Chief-of-Staff attention economy — bring the Operator only the irreducible decisions, never the triage. Realized: a two-sided operations desk — a read-model board that classifies incoming intent into dispositioned matters, and a write-model standing-orders that runs each matter to a pre-dispositioned brief — dogfooded end-to-end through a full intent-to-dispatch cycle."
  - "Delegation dispatch-safety — no work-order crosses a boundary to another dyad without a definition-of-done that lets it execute unsupervised and be verified on return. Realized: a five-facet completeness gate (purpose, interface, normal-exit, exception-exit, provenance) derived from an audience-by-phase lattice, then stress-tested by two adversarial falsifications that forced its own correction before the first live dispatch. Candidate — one live use; a known coherence gap is tracked openly, not hidden."
